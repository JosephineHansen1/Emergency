    <main>
      <h1>INDBERET SYGDOM</h1>
      <section id="form-section">
        <article id="form-info">
          <h2>Skyggemelankoli</h2>
          <p>Tekst</p>
        </article>
        <form id="webform">
          <!-- Navn -->
          <label for="name">Navn:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Indtast dit navn"
            required
          />

          <!-- Email -->
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Indtast din email"
            required
          />

          <!-- Antal flamingoer -->
          <label for="number">Hvor mange forskellige symptomer har du?</label>
          <input
            type="number"
            id="number"
            name="number"
            min="1"
            max="50"
            placeholder="1-50"
            required
          />

          <!-- Radio buttons -->
          <p>Har lægen konstateret sygdommen?</p>
          <input
            type="radio"
            id="Skyggemelankoli"
            name="behavior"
            value="Skyggemelankoli"
            required
          />
          <label for="Skyggemelankoli">Ja</label>
          <input type="radio" id="Nej" name="behavior" value="Nej" />
          <label for="Nej">Nej</label>

          <button type="submit">Send rapport</button>
        </form>

        <!--slut---->
        <form id="webform"></form>
      </section>
      <section id="form-summary">
        <h2>Summary</h2>
        <article>
          <p class="placeholder">Opsummering</p>
        </article>
